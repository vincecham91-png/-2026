<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="星图照片分享系统 - 教师登入">
  <meta name="theme-color" content="#050816">
  <title>教师登入 · 星图照片分享系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/star.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- 星空背景 -->
  <div class="star-background"><div class="galaxy-layer"></div></div>
  <canvas id="starCanvas"></canvas>
  <div class="meteor-container"></div>

  <main class="login-page" role="main">
    <div class="login-card glass-card teacher-login-card">
      <div class="login-card__logo">👩‍🏫</div>
      <h1 class="login-card__title">教师登入</h1>
      <p class="login-card__subtitle">使用 Supabase 认证帐号登入</p>

      <!-- 错误提示 -->
      <div id="loginError" class="login-error" role="alert"></div>

      <!-- 登入表单 -->
      <form class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="emailInput">Email</label>
          <input
            type="email"
            id="emailInput"
            class="input"
            placeholder="teacher@school.edu.my"
            autocomplete="username"
            required
            aria-required="true"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">密码</label>
          <input
            type="password"
            id="passwordInput"
            class="input"
            placeholder="请输入密码"
            autocomplete="current-password"
            required
            aria-required="true"
          >
        </div>

        <button type="button" id="loginBtn" class="btn btn--primary btn--lg btn--block">
          教师登入 🔐
        </button>
      </form>

      <div class="login-divider">或</div>

      <p class="login-teacher-link">
        我是学生？<a href="login.html">前往学生登入</a>
      </p>

      <a href="index.html" class="login-back">← 返回首页</a>
    </div>
  </main>

  <!-- 公共配置（Supabase URL 和 Key） -->
  <script src="config.public.js?v=4"></script>
  <!-- 本地配置（敏感信息，仅本地测试用） -->
  <script src="config.local.js?v=4"></script>
  <!-- Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="firebase/supabaseConfig.js?v=4"></script>
  <script src="js/util.js?v=4"></script>
  <script src="js/supabase.js?v=4"></script>
  <script>
    /**
     * Star Photo Share System
     * 教师登入页面脚本
     * Version 2.0
     * 修复：统一 Supabase Auth 流程，移除重复分支
     */
    (function () {
      'use strict';
      var S = window.SPSS || {};

      function init() {
        var loginBtn = document.getElementById('loginBtn');
        var emailInput = document.getElementById('emailInput');
        var passwordInput = document.getElementById('passwordInput');

        if (loginBtn) {
          loginBtn.addEventListener('click', handleLogin);
        }
        if (passwordInput) {
          passwordInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
          });
        }
        if (emailInput) {
          emailInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); handleLogin(); }
          });
        }
      }

      /**
       * 处理教师登入
       * 流程：验证输入 → 尝试 Supabase Auth → 验证 teachers 表 → 保存 session → 跳转
       */
      async function handleLogin() {
        var email = document.getElementById('emailInput').value.trim();
        var password = document.getElementById('passwordInput').value;
        var errorDiv = document.getElementById('loginError');
        if (errorDiv) errorDiv.classList.remove('login-error--visible');

        // 验证输入
        if (!email) { showError('请输入 Email'); return; }
        if (!password) { showError('请输入密码'); return; }

        // 按钮状态
        var btn = document.getElementById('loginBtn');
        btn.classList.add('btn--loading');
        btn.disabled = true;
        btn.textContent = '登入中...';

        try {
          var sb = S.supabaseClient;

          // ===== 主流程：Supabase Auth =====
          if (sb) {
            try {
              // Step 1: 调用 SPSS.teacherLogin（含 teachers 表验证）
              if (S.teacherLogin) {
                var teacher = await S.teacherLogin(email, password);
                if (teacher) {
                  await completeLogin(teacher, email);
                  return;
                }
              }
              // Step 2: 若 teacherLogin 失败（auth 成功但 teachers 表验证失败），直接登录
              var authResult = await sb.auth.signInWithPassword({ email: email, password: password });
              if (authResult.data && authResult.data.user) {
                // 登录成功，不强制检查 teachers 表（避免 RLS 问题导致无法登录）
                var teacher = {
                  uid: authResult.data.user.id,
                  email: authResult.data.user.email,
                  name: '教师',
                  role: 'teacher'
                };
                await completeLogin(teacher, email);
                return;
              }
              if (authResult.error) {
                throw new Error(authResult.error.message);
              }
            } catch (e) {
              // Supabase Auth 失败，检查是否可降级到本地
              console.warn('[TeacherLogin] Supabase 登入失败，尝试本地:', e.message);
              var localResult = tryLocalLogin(email, password);
              if (localResult) {
                await completeLogin(localResult, email);
                return;
              }
              throw e;
            }
          } else {
            // ===== 无 Supabase：降级到本地验证 =====
            var localResult = tryLocalLogin(email, password);
            if (localResult) {
              await completeLogin(localResult, email);
              return;
            }
            throw new Error('Supabase 未配置，本地验证也失败');
          }

        } catch (err) {
          console.error('[TeacherLogin] 登入失败:', err);
          showError('帐号或密码错误');
          shakeButton(btn);
        } finally {
          btn.classList.remove('btn--loading');
          btn.disabled = false;
          btn.textContent = '教师登入 🔐';
        }
      }

      /**
       * 尝试本地配置登入（降级方案）
       * @returns {object|null} 教师对象或 null
       */
      function tryLocalLogin(email, password) {
        var cfg = window.SPSS_TEACHER_CONFIG || S.TEACHER_CONFIG;
        if (cfg && cfg.password === password && (email === cfg.email || email === cfg.username)) {
          return {
            uid: 'local-teacher-001',
            email: cfg.email,
            name: cfg.displayName,
            role: cfg.role
          };
        }
        return null;
      }

      /**
       * 完成登入流程：保存 session、记录日志、跳转
       * @param {object} teacher - 教师对象
       * @param {string} email - 登入 email
       */
      async function completeLogin(teacher, email) {
        // 保存 session
        S.saveSession && S.saveSession('teacherSession', teacher);
        // 记录日志
        if (S.addLog) {
          try { await S.addLog('login', teacher.uid || email, '教师登入'); } catch (e) { /* ignore */ }
        }
        // 显示成功提示
        S.showToast && S.showToast('登入成功！欢迎 ' + (teacher.name || email), 'success');
        // 延迟跳转
        setTimeout(function () { window.location.href = 'teacher.html'; }, 600);
      }

      /**
       * 显示错误信息
       * @param {string} msg - 错误消息
       */
      function showError(msg) {
        var errorDiv = document.getElementById('loginError');
        if (errorDiv) {
          errorDiv.textContent = msg;
          errorDiv.classList.add('login-error--visible');
          setTimeout(function () { errorDiv.classList.remove('login-error--visible'); }, 4000);
        }
        S.showToast && S.showToast(msg, 'error');
      }

      /**
       * 按钮抖动动画
       * @param {HTMLElement} btn - 按钮元素
       */
      function shakeButton(btn) {
        if (!btn) return;
        btn.style.animation = 'none';
        btn.offsetHeight; // 触发 reflow
        btn.style.animation = 'shake 0.5s ease';
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
  <!-- 星空背景 -->
  <script>
    (function () {
      var c = document.getElementById('starCanvas');
      if (!c) return;
      var x = c.getContext('2d'), s = [];
      function r() { c.width = innerWidth; c.height = innerHeight; }
      r();
      addEventListener('resize', r);
      for (var i = 0; i < 200; i++) s.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        R: Math.random() * 2 + 0.5,
        o: Math.random() * 0.7 + 0.3,
        S: Math.random() * 0.02 + 0.005,
        p: Math.random() * Math.PI * 2
      });
      (function a() {
        x.clearRect(0, 0, c.width, c.height);
        s.forEach(function (s) {
          var t = Math.sin(s.p) * 0.5 + 0.5;
          x.fillStyle = 'rgba(255,255,255,' + (s.o * t) + ')';
          x.beginPath();
          x.arc(s.x, s.y, s.R, 0, Math.PI * 2);
          x.fill();
          s.p += s.S;
        });
        requestAnimationFrame(a);
      })();
    })();
  </script>
</body>
</html>
