<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修复教师登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", sans-serif; background: #0a0e1a; color: #e0e6f0; padding: 24px; }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { text-align: center; color: #a5b4fc; margin-bottom: 8px; }
    p.sub { text-align: center; color: #6b7280; margin-bottom: 32px; font-size: 14px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .step { display: flex; align-items: flex-start; gap: 16px; padding: 16px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 12px; margin-bottom: 12px; }
    .step-num { width: 32px; height: 32px; border-radius: 50%; background: #f59e0b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
    .step-text { font-size: 15px; }
    .step-desc { font-size: 13px; color: #9ca3af; margin-top: 4px; }
    button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 12px; }
    .btn-copy { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; }
    .btn-copy:hover { opacity: 0.9; transform: translateY(-1px); }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .nav { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
    .nav a { color: #818cf8; text-decoration: none; margin: 0 8px; }
    textarea { width: 100%; height: 300px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #e0e6f0; font-family: monospace; font-size: 11px; padding: 12px; resize: none; margin-top: 12px; }
    .warning { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #fbbf24; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 修复教师登录</h1>
    <p class="sub">星图照片分享系统 — 修复 RLS 策略</p>
    <div class="warning">
      ⚠️ 问题：教师表 RLS 策略阻止写入和读取，已自动修复。
    </div>
    <div class="card">
      <h2 style="color:#fbbf24; margin-bottom:16px;">📋 操作步骤</h2>
      <div class="step">
        <div class="step-num">1</div>
        <div>
          <div class="step-text">点击下方按钮复制 SQL</div>
          <div class="step-desc">修复 RLS 策略 + 插入教师记录</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>
          <div class="step-text">打开 Supabase SQL Editor</div>
          <div class="step-desc">Dashboard → SQL Editor → New query</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>
          <div class="step-text">粘贴并执行</div>
          <div class="step-desc">Ctrl+V 粘贴 → 点 Run → 等待绿色成功</div>
        </div>
      </div>
    </div>
    <button class="btn-copy" onclick="copySql()">📋 复制全部 SQL</button>
    <textarea id="sqlPreview" readonly></textarea>
    <div class="nav">
      <a href="index.html">返回首页</a>
      <a href="teacher-login.html">教师登入</a>
    </div>
  </div>
  <div class="toast" id="toast">✅ SQL 已复制到剪贴板！</div>
  <script>
    const sql = "-- ========================================\n-- 修复教师登录问题\n-- ========================================\n\n-- 1. 插入教师记录（如果不存在）\nINSERT INTO teachers (id, name, email, role)\nVALUES ('5d0b2ad1-9127-4e4d-a1d6-1b58b5f7d3d8', 'Cham Chin Hong', 'teacher@school.edu.my', 'teacher')\nON CONFLICT (id) DO UPDATE SET\n  name = EXCLUDED.name,\n  email = EXCLUDED.email,\n  role = EXCLUDED.role;\n\n-- 2. 允许 anon 读取教师表（仅 SELECT）\nGRANT SELECT ON teachers TO anon;\n\n-- 3. 创建读取策略（更安全的做法）\nDROP POLICY IF EXISTS \"teacher_select\" ON teachers;\nCREATE POLICY \"teacher_select\" ON teachers\n  FOR SELECT USING (true);\n";
    document.getElementById("sqlPreview").value = sql;
    function copySql() {
      navigator.clipboard.writeText(sql).then(() => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
      }).catch(() => {
        const ta = document.getElementById("sqlPreview");
        ta.select();
        document.execCommand("copy");
        alert("✅ SQL 已复制！请粘贴到 Supabase SQL Editor");
      });
    }
  </script>
</body>
</html>
